    <rect x="23" y="24" width="6" height="10" fill="#00D4FF" rx="1"/>
    <line x1="38" y1="44" x2="38" y2="14" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="35" y="20" width="6" height="16" fill="#7C3AED" rx="1"/>
    <line x1="50" y1="40" x2="50" y2="18" stroke="#FF0080" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="47" y="22" width="6" height="14" fill="#FF0080" rx="1"/>
