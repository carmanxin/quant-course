  function runMonteCarloVar() {
    const init = parseFloat(document.getElementById('mcInitial')?.value)||100000;

    const sig = (parseFloat(document.getElementById('mcVol')?.value)||20)/100;

    }

    const varVal = init - finals[Math.floor((1-conf)*5000)];
    const tail = finals.slice(0, Math.floor((1-conf)*5000));
    const cvar = tail.length ? init - (tail.reduce((a,b)=>a+b,0)/tail.length) : 0;
    document.getElementById('mcVarResult').innerHTML = `<p>${(conf*100).toFixed(0)}%置信度，${days}天VaR：<strong>$${varVal.toFixed(2)}</strong>，CVaR：<strong>$${cvar.toFixed(2)}</strong></p>`;

  function runICAnalysis() {

        r.push(0.02 * f[s] + normalRandom(0, 0.05));
      }
      factor.push(f); ret.push(r);

      const rankF = rank(f), rankR = rank(r);

    }
    const icMean = ic.reduce((a,b)=>a+b,0)/periods;
    const icStd = Math.sqrt(ic.reduce((s,v)=>s+(v-icMean)**2,0)/periods);
    const ir = icStd ? icMean / icStd : 0;
    document.getElementById('icMetrics').innerHTML = `<p>IC 均值：<strong>${icMean.toFixed(4)}</strong>，IC 标准差：<strong>${icStd.toFixed(4)}</strong>，IR：<strong>${ir.toFixed(2)}</strong></p>`;
    const canvas = document.getElementById('icCanvas'); if (!canvas) return;
    const ctx = canvas.getContext('2d'); const w=canvas.width=canvas.clientWidth||700; canvas.height=200; ctx.clearRect(0,0,w,200); drawGrid(ctx,w,200); drawLine(ctx,ic,'#a78bfa',w,200,2);
  }

  renderSidebar();
  window.addEventListener('load', initDefaultContent);
  window.addEventListener('resize', () => {
    const active = document.querySelector('.content-section.active');
    if (active) {
      const id = active.id;
      if (id.includes('2.3')) { drawRandomWalks(); drawCorrelationHeatmap(); }
      else if (id.includes('4.3')) simulatePerformance();
      else if (id.includes('5.1')) runICAnalysis();
      else if (id.includes('5.2')) runBacktest();
      else if (id.includes('6.1')) drawEfficientFrontier();
      else if (id.includes('6.5')) runMonteCarloVar();
    }
  });
</script>
</body>
</html>
