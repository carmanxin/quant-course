# ============================================================================
# QuantLab — 构建 + 双通道部署（EdgeOne Pages 主 / Cloudflare Pages 灾备）
# ============================================================================
# 触发：push 到 master/main，或手动 workflow_dispatch
#
# 关键设计：
#   1. 构建产物里的 Python 运行结果是**构建期预计算**出来的（precompute），
#      线上是纯静态站，不需要 Python 运行时。
#   2. precompute 需要 numpy/pandas/matplotlib 等，CI 里按需安装；
#      若仓库已提交 public/code 产物（>=480 个 output.json）则自动跳过，
#      构建时间从 ~20 分钟降到 ~4 分钟。
#   3. 两个平台都未配置 token 时，工作流仍会成功（只构建不部署），
#      方便先验证构建链路。
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   EDGEONE_API_TOKEN      必需（主站）      EdgeOne Pages 控制台 → API Token
#   CLOUDFLARE_API_TOKEN   可选（灾备）      Cloudflare → My Profile → API Tokens
#   CLOUDFLARE_ACCOUNT_ID  可选（灾备）      Cloudflare 控制台右侧栏
# 需要的 Variables（可选，覆盖默认项目名）：
#   EDGEONE_PROJECT        默认 quantlab
#   CLOUDFLARE_PROJECT     默认 quantlab
# ============================================================================

name: Build & Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      force_precompute:
        description: '强制重跑 Python 预计算（忽略已有产物）'
        type: boolean
        default: false
      deploy_env:
        description: '部署环境'
        type: choice
        options: [production, preview]
        default: production

# 同一分支并发部署时，取消旧任务（省额度、避免回滚到旧版本）
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  # precompute 并发数：GitHub 标准 runner 只有 2 核，压低避免 OOM/超时
  CONCURRENCY: '4'
  # 让 matplotlib 无 GUI 后端
  MPLBACKEND: 'svg'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build:
    name: 构建静态站
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pages: ${{ steps.count.outputs.pages }}
      size: ${{ steps.count.outputs.size }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 注意：这里不能开 `cache: 'pip'`。
      # 当产物已提交、precompute 被跳过时，本轮根本不会跑 pip install，
      # setup-python 的 Post 步骤会因"无缓存可保存"直接失败，把整个 job 拖成 failure
      #（构建本身其实是成功的）。需要装依赖时多花 2-3 分钟，比 job 假失败划算。
      - name: 安装 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Node 依赖
        run: npm ci

      # ------------------------------------------------------------------
      # 预计算产物策略（2026-10-26 修正）：
      #   判据改为「索引完整性」——比对 _index.json 条目数 与 md 中唯一 fence 数。
      #
      #   旧判据 `ls public/code/*.output.json | wc -l >= 480` 有逻辑悖论：
      #     一轮全新 precompute 的产出上限 = 唯一 fence 数（439）< 480，
      #     即阈值永远达不到；仓库之所以"够数"，靠的是 145 个
      #     _index.json 未引用的孤儿产物在凑数。一旦清理孤儿产物即跌破。
      #     旧判据同时让「改了 md 后重建结果」这条路在 CI 中形同虚设。
      #
      #   新判据自洽：
      #     INDEX_N = _index.json 条目数
      #     FENCE_N = md 中唯一 python fence 数（与 extract 去重口径一致）
      #     二者相等 ⇒ 索引已覆盖全部代码块，产物齐全 ⇒ 跳过 precompute
      # ------------------------------------------------------------------
      - name: 检测预计算产物是否齐全
        id: has_outputs
        run: |
          INDEX_N=$(python3 -c "import json;print(len(json.load(open('public/code/_index.json'))))" 2>/dev/null || echo 0)
          # 唯一 fence 数：与 scripts/extract-py-fences.mjs 同口径（归一化后 hash 去重）
          FENCE_N=$(node scripts/count-unique-fences.mjs 2>/dev/null || echo 0)
          # 索引条目是否都有对应产物文件
          MISSING=$(python3 -c "
            import json,os
            idx=json.load(open('public/code/_index.json'))
            names=set(idx.values())
            miss=[n for n in names if not os.path.exists('public/code/'+n+'.output.json')]
            print(len(miss))
          " 2>/dev/null || echo 999)
          echo "index=$INDEX_N fences=$FENCE_N missing=$MISSING"
          if [ "${{ inputs.force_precompute }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "强制重跑预计算"
          elif [ "$INDEX_N" -gt 0 ] && [ "$INDEX_N" = "$FENCE_N" ] && [ "$MISSING" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "索引完整（$INDEX_N 条 = $FENCE_N 个唯一 fence，产物无缺失），跳过 precompute"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "索引不完整（index=$INDEX_N, fences=$FENCE_N, missing=$MISSING），需要跑 precompute"
          fi

      - name: 安装精简 Python 依赖
        if: steps.has_outputs.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
        continue-on-error: true

      - name: 抽取 Python 代码块
        if: steps.has_outputs.outputs.skip != 'true'
        run: node scripts/extract-py-fences.mjs

      - name: 预计算运行结果（最耗时的一步）
        if: steps.has_outputs.outputs.skip != 'true'
        run: node scripts/precompute-py-outputs.mjs
        continue-on-error: true

      - name: 重建代码块索引
        if: steps.has_outputs.outputs.skip != 'true'
        run: python scripts/build-code-index.py
        continue-on-error: true

      - name: VitePress 构建
        run: npx vitepress build

      # 不跑 relativize-dist.mjs：线上用绝对路径更标准
      # （该脚本只服务于 portable/ 的 file:// 场景）

      - name: 统计产物
        id: count
        run: |
          PAGES=$(find .vitepress/dist -name '*.html' | wc -l)
          SIZE=$(du -sh .vitepress/dist | cut -f1)
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "构建完成：$PAGES 个页面，$SIZE"

      - name: 冒烟检查
        run: |
          test -f .vitepress/dist/index.html || { echo "::error::缺少 index.html"; exit 1; }
          # 不允许出现预计算噪音
          if grep -rlq '本段代码定义：' .vitepress/dist --include='*.html'; then
            echo "::warning::检测到残留的『本段代码定义：』裸字符串"
          fi
          echo "冒烟检查通过"

      # 2026-10-27 司礼监第四令：把四枚常态化审计脚本接入 CI 冒烟。
      # 此前 CI 只验「index.html 存在」与「裸字符串残留」，
      # 未校验 ①结果↔代码对应性 ②组件是否渲染 ③索引是否完整 —— 三处皆曾出过静默缺陷。
      # 本步任何一项失败即中断部署，避免把坏产物推上线。
      - name: 常态化审计（哈希一致性 / 页面映射 / 渲染层 / 组件注册）
        run: |
          set -e
          for s in _audit-hash-consistency _audit-page-mapping _audit-e2e-rendered _audit-components; do
            echo "::group::$s"
            node "tests/$s.mjs"
            echo "::endgroup::"
          done
          echo "四枚审计脚本全部通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: .vitepress/dist
          # dist 约 79MB。保留 7 天会累积 500MB+，容易吃掉
          # 私有仓库 500MB 的 artifact 免费额度；部署完就不需要了，留 2 天足够回溯
          retention-days: 2

  deploy-edgeone:
    name: 部署到 EdgeOne Pages（主站）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    env:
      HAS_TOKEN: ${{ secrets.EDGEONE_API_TOKEN != '' }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 未配置 Token，跳过
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::未配置 EDGEONE_API_TOKEN，跳过 EdgeOne 部署。"
          echo ""
          echo "::notice::EdgeOne API Token 的正确获取路径（与普通 EdgeOne 控制台不同）："
          echo "::notice::1. 登录 EdgeOne 控制台 https://edgeone.ai"
          echo "::notice::2. 切到顶部「Makers」Tab（或直接访问 Pages 控制台）"
          echo "::notice::3. 点「API Token」Tab → 「创建 API Token」→ 填描述 + 过期时间 → 提交"
          echo "::notice::4. Token 仅显示一次，立即复制"
          echo "::notice::5. GitHub 仓库 → Settings → Secrets and variables → Actions → New repository secret"
          echo "::notice::   Name 填 EDGEONE_API_TOKEN，Value 粘贴刚才复制的 token"
          echo ""
          echo "::notice::注意：不要在腾讯云国内控制台 console.cloud.tencent.com 找 —— 那是国内版，会强制 ICP 备案。"
          echo "::notice::项目名可在仓库 Variables 里设 EDGEONE_PROJECT（默认 quantlab），须与控制台项目名一致。"

      - name: 部署
        if: env.HAS_TOKEN == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          PROJECT="${{ vars.EDGEONE_PROJECT || 'quantlab' }}"
          ENVIRON="${{ inputs.deploy_env || 'production' }}"
          echo "项目名 : $PROJECT （若与控制台项目名不同，CLI 会另建新项目）"
          echo "环境   : $ENVIRON"
          echo "区域   : global（国际版，免 ICP 备案；国内版会要求备案并回 401）"
          echo "规模   : ${{ needs.build.outputs.pages }} 页 / ${{ needs.build.outputs.size }}"
          # CLI 参数以 v1.6.46 源码实测为准：
          #   -n/--name 项目名（不存在则自动创建）  -t/--token API Token
          #   -e/--env production|preview            -a/--area global|overseas（默认 global）
          #   --json 输出单行 JSON，便于 CI 解析部署地址
          # ⚠ --site 仅用于「匿名部署」的站点判定，对带 Token 的正式部署不适用，故不用。
          npx --yes edgeone makers deploy ./dist \
            -n "$PROJECT" \
            -t "$EDGEONE_API_TOKEN" \
            -e "$ENVIRON" \
            -a global \
            --json

  deploy-cloudflare:
    name: 部署到 Cloudflare Pages（灾备）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 未配置 Token，跳过
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::未配置 CLOUDFLARE_API_TOKEN，跳过 Cloudflare 灾备部署。"

      - name: 部署
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="${{ vars.CLOUDFLARE_PROJECT || 'quantlab' }}"
          echo "确保 Cloudflare Pages 项目 $PROJECT 存在（不存在则创建）"
          # 非交互下若项目已存在会报 "already exists"，吞掉即可
          npx --yes wrangler@latest pages project create "$PROJECT" --production-branch master 2>/dev/null || true
          echo "部署 $PROJECT"
          npx --yes wrangler@latest pages deploy ./dist \
            --project-name "$PROJECT" \
            --branch "${{ github.ref_name }}"

  # 保底通道：把构建产物推到 dist 分支，任何支持 Git 集成的平台都能直接吃
  publish-dist-branch:
    name: 发布 dist 分支（保底通道）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist-out

      # 在独立目录里初始化一个只含 dist 内容的干净仓库再强推，
      # 避免 orphan 分支残留源码目录、也避免历史无限膨胀
      - name: 推送到 dist 分支
        run: |
          cd dist-out
          # dist 分支根目录就是构建产物，wrangler.toml 的 assets 指向 "."（分支根）
          cat > wrangler.toml <<'EOF'
          name = "quant-course"
          compatibility_date = "2026-09-08"

          [assets]
          directory = "."
          not_found_handling = "404-page"
          EOF
          git init -q
          git checkout -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA} (${{ needs.build.outputs.pages }} pages)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
